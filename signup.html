<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — DSA Roadmap</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="terminal-window">
      <div class="terminal-titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span>signup.sh</span>
      </div>
      <div class="terminal-body">
        <div class="prompt-line"><span class="accent">$</span> ./create-account --student</div>
        <h1 class="auth-heading">Create your account</h1>
        <p class="auth-sub">Track solved problems and XP across every device you study on.</p>

        <div class="error-banner" id="errorBanner"></div>

        <form id="signupForm">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">College email</label>
            <input type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" minlength="6" required />
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <button class="link" id="goLogin">Log in</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    const form = document.getElementById('signupForm');
    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signUpStudent(name, email, password);
        window.location.href = 'app.html';
      } catch (err) {
        errorBanner.textContent = friendlyAuthError(err);
        errorBanner.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });

    document.getElementById('goLogin').addEventListener('click', () => {
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
